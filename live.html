<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Live | Enactus MUJ</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <style>
        /* ── LIVE PAGE SPECIFIC STYLES ── */

        .live-hero {
            background-color: #f4f4f4;
            border-bottom: 1px solid #e0e0e0;
            padding: 36px 0 30px 0;
            text-align: center;
        }

        .live-hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: #000;
            margin-bottom: 6px;
        }

        .live-hero p {
            font-family: 'Open Sans', sans-serif;
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }

        .live-pulse-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 20px;
            border-radius: 30px;
            margin-bottom: 24px;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #e03a2f;
            animation: livepulse 1.4s infinite;
        }

        @keyframes livepulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.3;
                transform: scale(0.6);
            }
        }

        /* ── STREAM LAYOUT ── */
        .live-section {
            padding: 40px 0 60px;
            background: #f8f8f8;
        }

        .live-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: start;
        }

        /* ── PLAYER ── */
        .player-wrap {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #twitch-embed {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            background: #111;
            border: 2px solid #EAAD00;
            position: relative;
        }

        #twitch-embed iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        /* Loading overlay */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            border-radius: 10px;
            transition: opacity 0.5s;
            z-index: 10;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #333;
            border-top-color: #EAAD00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-overlay p {
            color: #aaa;
            font-family: 'Open Sans', sans-serif;
            font-size: 0.9rem;
        }

        /* Stream info bar */
        .stream-info-bar {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-left: 4px solid #EAAD00;
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stream-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #EAAD00;
            display: grid;
            place-items: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #000;
            flex-shrink: 0;
        }

        .stream-meta {
            flex: 1;
        }

        .stream-meta .name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #000;
        }

        .stream-meta .sub {
            font-family: 'Open Sans', sans-serif;
            font-size: 0.8rem;
            color: #888;
            margin-top: 2px;
        }

        .status-pill {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            background: #f0f0f0;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .status-pill.online {
            background: #e8f8ef;
            color: #1a9c52;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        /* ── CHAT PANEL ── */
        .chat-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
        }

        #twitch-chat {
            height: 520px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        #twitch-chat iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        .twitch-link-btn {
            display: block;
            text-align: center;
            background: #EAAD00;
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 8px;
            transition: background 0.2s, transform 0.15s;
        }

        .twitch-link-btn:hover {
            background: #d89e00;
            transform: translateY(-1px);
        }

        /* ── BACK BUTTON ── */
        .back-bar {
            padding: 14px 0 0;
        }

        .back-link {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #EAAD00;
        }

        /* ── OFFLINE STATE ── */
        .offline-box {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            display: none;
        }

        .offline-box.show {
            display: block;
        }

        .offline-box h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #000;
        }

        .offline-box p {
            font-family: 'Open Sans', sans-serif;
            font-size: 15px;
            color: #666;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .live-grid {
                grid-template-columns: 1fr;
            }

            #twitch-chat {
                height: 400px;
            }

            .live-hero h1 {
                font-size: 30px;
            }
        }

        @media (max-width: 500px) {
            .live-hero h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER — matches existing site exactly -->
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="image/logo.png" alt="Enactus MUJ Logo">
                </a>
            </div>
            <nav class="main-nav">
                <button class="menu-toggle" aria-label="Toggle navigation menu">&#9776;</button>
                <ul class="nav-links">
                    <li><a href="blogs/index.html"><u>Check out our Blogs</u></a></li>
                    <li><a href="index.html#foosball">Event</a></li>
                    <li><a href="index.html#projects">Projects</a></li>
                    <li><a href="index.html#about">About Us</a></li>
                    <li><a href="index.html#members">Members</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- LIVE HERO BANNER -->
    <div class="live-hero">
        <div class="container">
            <div class="live-pulse-badge">
                <span class="live-dot"></span>
                Live Now
            </div>
            <h1>Human Foosball — Live Stream</h1>
            <p>Enactus MUJ × Oneiros &nbsp;·&nbsp; Watch the action unfold in real time</p>
        </div>
    </div>

    <!-- STREAM SECTION -->
    <section class="live-section">
        <div class="container">

            <!-- <div class="back-bar">
                <a href="index.html" class="back-link">← Back to Home</a>
            </div> -->

            <br>

            <div class="live-grid">

                <div class="stream-info-bar">
                    <div class="stream-avatar">E</div>
                    <div class="stream-meta">
                        <div class="name">Enactus MUJ</div>
                        <div class="sub">Human Foosball · Oneiros Annual Fest</div>
                    </div>
                    <div class="status-pill" id="status-pill">
                        <span class="status-dot"></span>
                        <span id="status-text">Connecting…</span>
                    </div>
                </div>

                <div class="player-wrap">

                    <!-- VIDEO PLAYER -->
                    <div class="player-wrap">
                        <div id="twitch-embed" style="position:relative;">
                            <div class="loading-overlay" id="loading-overlay">
                                <div class="spinner"></div>
                                <p>Connecting to stream…</p>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="back-bar">
                <a href="index.html" class="back-link">← Back to Home</a>
            </div>
            </div>
    </section>

    <footer></footer>

    <script src="js/script.js"></script>
    <script>
        // ── CONFIG ────────────────────────────────
        const CHANNEL = "dexdior447";
        const PARENT = "enactus-muj-official.vercel.app";
        // ─────────────────────────────────────────

        /* Player */
        const player = new Twitch.Embed("twitch-embed", {
            width: "100%",
            height: "100%",
            channel: CHANNEL,
            parent: [PARENT],
            layout: "video",
            autoplay: true,
            muted: false,
            theme: "light",
        });

        player.addEventListener(Twitch.Embed.VIDEO_READY, () => {
            document.getElementById("loading-overlay").classList.add("hidden");
        });

        player.addEventListener(Twitch.Embed.VIDEO_PLAY, () => {
            const pill = document.getElementById("status-pill");
            pill.classList.add("online");
            document.getElementById("status-text").textContent = "Live";
        });

        /* Offline fallback */
        setTimeout(() => {
            const overlay = document.getElementById("loading-overlay");
            if (!overlay.classList.contains("hidden")) {
                overlay.classList.add("hidden");
                const pill = document.getElementById("status-pill");
                document.getElementById("status-text").textContent = "Offline";
            }
        }, 9000);
    </script>

</body>

</html>
